apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          containers:
            - name: nextcloud-cron
              image: nextcloud:34.0.2-apache
              command: ["php", "-f", "/var/www/html/cron.php"]
              env:
                - name: POSTGRES_HOST
                  value: postgres
                - name: POSTGRES_DB
                  value: nextcloud
                - name: POSTGRES_USER
                  value: nextcloud
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-container-env
                      key: POSTGRES_PASSWORD
                - name: REDIS_HOST
                  value: redis
                - name: REDIS_HOST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-container-env
                      key: REDIS_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data