apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.9.11
          ports:
            - containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: jellyfin-movies
              mountPath: /media
              readOnly: false
            - name: jellyfin-config
              mountPath: /config

      volumes:
        - name: jellyfin-movies
          hostPath:
            path: /mnt/music/movies
            type: Directory
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc