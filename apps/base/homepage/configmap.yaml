apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.tonygunnca.com
            description: Movies & TV
        - Navidrome:
            icon: navidrome.png
            href: https://navidrome.tonygunnca.com
            description: Music
    - Storage & Sync:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.tonygunnca.com
            description: Cloud Storage
    - Utilities:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.tonygunnca.com
            description: Password Manager
        - Linkding:
            icon: linkding.png
            href: https://linkding.tonygunnca.com
            description: Bookmarks
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
  bookmarks.yaml: |
    []
  kubernetes.yaml: |
    ""
  docker.yaml: |
    ""
  proxmox.yaml: |
    ""
  custom.css: ""
  custom.js: ""