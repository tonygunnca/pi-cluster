apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.tonygunnca.com
            description: Movies & TV
            widget:
              type: jellyfin
              url: http://jellyfin.jellyfin.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              enableBlocks: true
              enableNowPlaying: true
        - Navidrome:
            icon: navidrome.png
            href: https://navidrome.tonygunnca.com
            description: Music
    - Storage & Sync:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.tonygunnca.com
            description: Cloud Storage
    - Utilities:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.tonygunnca.com
            description: Password Manager
        - Linkding:
            icon: linkding.png
            href: https://linkding.tonygunnca.com
            description: Bookmarks
        - Stirling-PDF:
            icon: https://cdn.jsdelivr.net/npm/@thesvg/icons/icons/stirling-pdf.svg
            href: https://stirlingpdf.tonygunnca.com
            description: PDF Editor
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        locale: us
        format:
          timeStyle: long
          dateStyle: long
  bookmarks.yaml: |
    []
  kubernetes.yaml: |
    ""
  docker.yaml: |
    ""
  proxmox.yaml: |
    ""
  custom.css: ""
  custom.js: ""