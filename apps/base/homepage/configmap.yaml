apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.tonygunnca.com
            description: Movies & TV
            widget:
              type: jellyfin
              url: http://jellyfin.jellyfin.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              enableBlocks: true
              enableNowPlaying: true
        - Navidrome:
            icon: navidrome.png
            href: https://navidrome.tonygunnca.com
            description: Music
            widget:
              type: navidrome
              url: http://navidrome.navidrome.svc.cluster.local:4533
              user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
        - freshrss:
            icon: freshrss.png
            href: https://freshrss.tonygunnca.com
            description: News Reader
    - Lifestyle:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.tonygunnca.com
            description: Cloud Storage
        - Vikunja:
            icon: vikunja.svg
            href: https://vikunja.tonygunnca.com
            description: Task Manager
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.tonygunnca.com
            description: Password Manager
        - Linkwarden:
            icon: linkwarden.png
            href: https://linkwarden.tonygunnca.com
            widget:
              type: linkwarden
              url: http://linkwarden.linkwarden.svc.cluster.local:3000
              key: {{HOMEPAGE_VAR_LINKWARDEN_API_KEY}}
    - Utilities:
        - Linkding:
            icon: linkding.png
            href: https://linkding.tonygunnca.com
            description: Bookmarks
        - Stirling-PDF:
            icon: stirling-pdf.svg
            href: https://stirlingpdf.tonygunnca.com
            description: PDF Editor
        - SearXNG:
            icon: searxng.svg
            href: https://searxng.tonygunnca.com
            description: Search
        - Joplin:
            icon: joplin.svg
            href: https://joplin.tonygunnca.com
            description: Notes
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        locale: us
        format:
          timeStyle: long
          dateStyle: long
  bookmarks.yaml: |
    []
  kubernetes.yaml: |
    ""
  docker.yaml: |
    ""
  proxmox.yaml: |
    ""
  custom.css: ""
  custom.js: ""