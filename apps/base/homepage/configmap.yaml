apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.tonygunnca.com
            description: Movies & TV
            widget:
              type: jellyfin
              url: http://jellyfin.jellyfin.svc.cluster.local:8096
              key: your-jellyfin-api-key
              enableBlocks: true
              enableNowPlaying: true
        - Navidrome:
            icon: navidrome.png
            href: https://navidrome.tonygunnca.com
            description: Music
            widget:
              type: navidrome
              url: http://navidrome.navidrome.svc.cluster.local:4533
              user: your-navidrome-username
              token: your-md5-token
              salt: your-salt
    - Storage & Sync:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.tonygunnca.com
            description: Cloud Storage
            widget:
              type: nextcloud
              url: http://nextcloud.nextcloud.svc.cluster.local:80
              key: your-nc-token
    - Utilities:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.tonygunnca.com
            description: Password Manager
        - Linkding:
            icon: linkding.png
            href: https://linkding.tonygunnca.com
            description: Bookmarks
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
  bookmarks.yaml: |
    []
  kubernetes.yaml: |
    ""
  docker.yaml: |
    ""
  proxmox.yaml: |
    ""
  custom.css: ""
  custom.js: ""