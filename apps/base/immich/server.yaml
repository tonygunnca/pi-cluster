apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      enableServiceLinks: false
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.4.2
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_ENABLED
              value: "false"
          ports:
            - containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: photos
              mountPath: /data
      volumes:
        - name: photos
          hostPath:
            path: /mnt/music/Photos
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283