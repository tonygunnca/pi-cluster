apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  glance.yml: |
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: monitor
                title: Services
                cache: 1m
                sites:
                  - title: Navidrome
                    url: https://navidrome.tonygunnca.com
                    check-url: http://navidrome.navidrome.svc.cluster.local:4533
                    icon: si:navidrome
                  - title: Nextcloud
                    url: https://nextcloud.tonygunnca.com
                    icon: si:nextcloud
                  - title: Vaultwarden
                    url: https://vault.tonygunnca.com
                    check-url: http://vaultwarden.vaultwarden.svc.cluster.local:80
                    icon: si:vaultwarden
                  - title: Linkding
                    url: https://linkding.tonygunnca.com
                    check-url: http://linkding.linkding.svc.cluster.local:9090
                    icon: si:linkding
                  - title: Jellyfin
                    url: https://jellyfin.tonygunnca.com
                    check-url: http://jellyfin.jellyfin.svc.cluster.local:8096
                    icon: si:jellyfin
                  - title: StirlingPDF
                    url: https://stirlingpdf.tonygunnca.com
                    check-url: http://stirling-pdf.stirling-pdf.svc.cluster.local:8080/api/v1/info/status
                    icon: https://cdn.jsdelivr.net/npm/@thesvg/icons/icons/stirling-pdf.svg
                  - title: FreshRSS
                    url: https://freshrss.tonygunnca.com
                    check-url: http://freshrss.freshrss.svc.cluster.local:80
                    icon: si:freshrss
                  - title: SparkyFitness
                    url: https://fitness.tonygunnca.com
                    check-url: https://fitness.tonygunnca.com/api/version/current
              - type: server-stats
                servers:
                  - type: local
                    name: pi-cluster
              - type: rss
                title: News
                limit: 10
                collapse-after: 5
                cache: 20m
                feeds:
                  - url: https://news.ycombinator.com/rss
                    title: Hacker News
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://selfh.st/rss/
                    title: Self-Hosted
                  - url: https://www.reddit.com/r/homelab/.rss
                    title: r/homelab
                  - url: https://www.reddit.com/r/kubernetes/.rss
                    title: r/kubernetes
          - size: small
            widgets:
              - type: weather
                location: Los Angeles, United States
              - type: clock
                hour-format: 24h

      - name: Homepage
        columns:
          - size: full
            widgets:
              - type: iframe
                source: https://homepage.tonygunnca.com
                height: 800