apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  glance.yml: |
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: monitor
                title: Services
                cache: 1m
                sites:
                  - title: Navidrome
                    url: https://navidrome.tonygunnca.com
                    check-url: http://navidrome.navidrome.svc.cluster.local:4533
                    icon: si:navidrome
                  - title: Nextcloud
                    url: https://nextcloud.tonygunnca.com
                    icon: si:nextcloud
                  - title: Vaultwarden
                    url: https://vault.tonygunnca.com
                    check-url: http://vaultwarden.vaultwarden.svc.cluster.local:80
                    icon: si:vaultwarden
                  - title: Linkding
                    url: https://linkding.tonygunnca.com
                    check-url: http://linkding.linkding.svc.cluster.local:9090
                    icon: si:linkding
              - type: server-stats
                servers:
                  - type: local
                    name: pi-cluster
          - size: small
            widgets:
              - type: weather
                location: Los Angeles, United States
              - type: clock
                hour-format: 24h
              - type: custom-api
  title: Last Race Results
  cache: 1d
  url: https://f1api.dev/api/current/last/race
  template: |
    <div class="flex flex-column gap-10">
      <p class="size-h5">{{ .JSON.String "races.raceName" }}</p>
      <ul class="list collapsible-container" data-collapse-after="5">
        {{ range $i, $v := .JSON.Array "races.results" }}
        <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
          <span class="grow min-width-0">{{ .String "position" }}. {{ .String "driver.shortName" }}</span>
          <span class="shrink-0 text-right">{{ .String "time" }}</span>
        </li>
        {{ end }}
      </ul>
    </div>