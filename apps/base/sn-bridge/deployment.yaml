apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sn-bridge
  template:
    metadata:
      labels:
        app: sn-bridge
    spec:
      containers:
        - name: sn-bridge
          image: ghcr.io/tonygunnca/servicenow-alertmanager-bridge:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sn-bridge-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
