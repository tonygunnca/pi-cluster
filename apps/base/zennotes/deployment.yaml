apiVersion: apps/v1
kind: Deployment
metadata:
  name: zennotes
  namespace: zennotes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zennotes
  template:
    metadata:
      labels:
        app: zennotes
    spec:
      containers:
        - name: zennotes
          image: adibhanna/zennotes@sha256:440cdd056d080019fc0488795e240f0cdb988e82522164ae3a23013d0cdf2a42
          env:
            - name: ZENNOTES_BIND
              value: "0.0.0.0:7878"
            - name: ZENNOTES_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zennotes-auth
                  key: ZENNOTES_AUTH_TOKEN
          ports:
            - containerPort: 7878
          volumeMounts:
            - name: config
              mountPath: /data
            - name: vault
              mountPath: /workspace
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: zennotes-config
        - name: vault
          persistentVolumeClaim:
            claimName: zennotes-vault