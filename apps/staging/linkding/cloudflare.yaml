apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2 # You could also consider elastic scaling for this deployment
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel

        # Points cloudflared to the config file, which configures what
        # cloudflared will actually do. This file is created by a ConfigMap
        # below.
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        livenessProbe:
          httpGet:
            # Cloudflared has a /ready endpoint which returns 200 if and only if
            # it has an active connection to the edge.
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        # Each tunnel has an associated "credentials file" which authorizes machines
        # to run the tunnel. cloudflared will read this file from its local filesystem,
        # and it'll be stored in a k8s secret.
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials

      # Create a config.yaml file from the ConfigMap below.
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
---
# This ConfigMap is just a way to define the cloudflared config.yaml file in k8s.
# It's useful to define it in k8s, rather than as a stand-alone .yaml file, because
# this lets you use various k8s templating solutions (e.g. Helm charts) to
# parameterize your config, instead of just using string literals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    # Name of the tunnel you want to run
    
    tunnel: ldpi

    credentials-file: /etc/cloudflared/creds/credentials.json

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    
    ingress:
    - hostname: linkding.tonygunnca.com
      service: http://linkding:9090
    - hostname: vault.tonygunnca.com
      service: http://vaultwarden.vaultwarden.svc.cluster.local:80
    - hostname: navidrome.tonygunnca.com
      service: http://navidrome.navidrome.svc.cluster.local:4533
    - hostname: nextcloud.tonygunnca.com
      service: http://nextcloud.nextcloud.svc.cluster.local:80
    - hostname: glance.tonygunnca.com
      service: http://glance.glance.svc.cluster.local:8080
    - hostname: jellyfin.tonygunnca.com
      service: http://jellyfin.jellyfin.svc.cluster.local:8096
    - hostname: homepage.tonygunnca.com
      service: http://homepage.homepage.svc.cluster.local:80
    - hostname: stirlingpdf.tonygunnca.com
      service: http://stirling-pdf.stirling-pdf.svc.cluster.local:8080 
    - hostname: hello.example.com
      service: hello_world
    - service: http_status:404 